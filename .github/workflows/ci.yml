# Builds and tests every push to main and every pull request, so a broken build shows up
# before release day.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: xcodebuild test -scheme UnderPressure -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath build/DerivedData -quiet
      - name: Universal Release build
        run: xcodebuild build -scheme UnderPressure -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO -quiet
